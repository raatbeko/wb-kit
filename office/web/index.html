<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WB Офис</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/workspace.css">
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<header class="top">
  <div class="brand">WB <b>Офис</b> <span id="shop" class="shop"></span><span id="demo-badge" class="badge" hidden>демо</span></div>
  <div class="kpis" id="kpis" aria-label="Цифры магазина"></div>
  <div class="actions">
    <button id="approvals-btn" class="btn ghost" type="button" title="Ждут вашего решения">Решения <span id="approvals-count" class="count">0</span></button>
    <button id="reports-btn" class="btn ghost" type="button">Отчёты</button>
    <button id="sync-btn" class="btn ghost" type="button" title="Обновить данные WB">Обновить</button>
    <div class="seg" role="group" aria-label="Вид">
      <button id="view-3d" type="button" aria-pressed="true">3D</button>
      <button id="view-2d" type="button" aria-pressed="false">2D</button>
    </div>
  </div>
</header>

<main class="stage">
  <div id="scene" class="scene" aria-label="3D-офис"></div>
  <div id="cards" class="cards" hidden></div>

  <section class="feed" aria-label="Что происходит">
    <div class="feed-head"><span id="conn" class="conn">Подключаюсь…</span><span id="mode" class="mode"></span></div>
    <ol id="feed"></ol>
  </section>

  <aside id="panel" class="panel" hidden>
    <div class="panel-ctl">
      <button id="panel-full" class="ctl" type="button" title="Развернуть на весь экран" aria-label="Развернуть на весь экран">⤢</button>
      <button id="panel-close" class="ctl" type="button" title="Закрыть (Esc)" aria-label="Закрыть">×</button>
    </div>
    <div id="ws" class="ws" hidden></div>
    <div id="panel-body"></div>
  </aside>
</main>

<dialog id="modal" class="modal" aria-label="Просмотр">
  <button id="modal-close" class="ctl modal-x" type="button" aria-label="Закрыть">×</button>
  <div id="modal-body"></div>
</dialog>

<div id="notice" class="notice" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
